# The FIRST winget-pkgs submission of Vyomi.Vyomi is manual (winget-releaser only
# UPDATES existing packages); subsequent releases are auto-bumped by the
# `winget-submit` job, which regenerates the Installers block (InstallerUrl +
# InstallerSha256 + ProductCode) from the actual built MSI at release time.
PackageIdentifier: Vyomi.Vyomi
PackageVersion: 3.0.6
InstallerType: msi
Scope: machine
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install
# ARP (Add/Remove Programs) detection anchor. Vyomi is a CLI launcher MSI with no
# GUI, so winget's automated installation validation can't "see" a running app;
# giving it the exact ProductCode + the stable UpgradeCode + the ARP DisplayName/
# Publisher/Version lets winget reliably detect the install post-install. Values
# read from the real v3.0.0 MSI Property table. ProductCode is per-build; the
# UpgradeCode is stable across versions.
ProductCode: '{FA57F040-FF86-461D-84A5-F9C0E77F3CB5}'
AppsAndFeaturesEntries:
  - DisplayName: Vyomi
    Publisher: Vyomi Cloud
    DisplayVersion: 3.0.6
    ProductCode: '{FA57F040-FF86-461D-84A5-F9C0E77F3CB5}'
    UpgradeCode: '{7B95B0F4-1E4D-4E0E-9C8D-29D2F1D93A11}'
    InstallerType: msi
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/vyomi-cloud/appliance/releases/download/v3.0.6/cloud-learn-3.0.6-x64.msi
    # Regenerated by the winget-submit job from the built v3.0.6 MSI at release time.
    InstallerSha256: REPLACED_BY_WINGET_SUBMIT
ManifestType: installer
ManifestVersion: 1.6.0
