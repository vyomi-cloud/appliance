name: Release on daily PR merge

# Merging a daily conformance PR (label daily-release, head conformance/daily-*)
# into main cuts the next PATCH release (3.0.7 → 3.0.8):
#   1. bump VERSION + package manifests + CHANGELOG on main
#   2. create release/vX.Y.Z and tag vX.Y.Z — pushed with CONFORMANCE_BOT_TOKEN,
#      so the tag triggers release.yml + docker-publish.yml like a manual release
#   3. merge the linked portal PR (deploys the portal), if there is one
#
# Merge (not approve) is the trigger: the bot token acts as the repo owner, who
# can't approve a PR they authored.

on:
  pull_request:
    types: [closed]

concurrency:
  group: conformance-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'conformance/daily-') &&
      contains(github.event.pull_request.labels.*.name, 'daily-release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.CONFORMANCE_BOT_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Require the bot token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the CONFORMANCE_BOT_TOKEN secret to cut releases."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CONFORMANCE_BOT_TOKEN }}

      - name: Bump to the next patch version on main
        id: v
        run: |
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"
          OLD=$(tr -d '[:space:]' < VERSION)
          NEW=$(python3 -c "v='$OLD'.split('.');v[-1]=str(int(v[-1])+1);print('.'.join(v))")
          if git ls-remote --exit-code --tags origin "v$NEW" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW already exists"; exit 1
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"; echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "$NEW" > VERSION
          for f in packaging/rpm/cloud-learn.spec packaging/scoop/vyomi.json packaging/scoop/cloud-learn.json \
                   packaging/snap/snapcraft.yaml packaging/winget/Vyomi.Vyomi.yaml \
                   packaging/winget/Vyomi.Vyomi.installer.yaml packaging/winget/Vyomi.Vyomi.locale.en-US.yaml; do
            [ -f "$f" ] && sed -i "s/$(echo "$OLD" | sed 's/\./\\./g')/$NEW/g" "$f"
          done
          # Changelog lines = the commits that came in with this PR.
          gh pr view "$PR" --json commits -q '.commits[].messageHeadline' \
            | grep -v '^Merge ' | sed 's/^/- /' > /tmp/changes.md || true
          python3 - "$NEW" <<'PY'
          import sys, datetime
          new = sys.argv[1]
          log = open("/tmp/changes.md", encoding="utf-8").read().strip() or "- Conformance fixes"
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          entry = f"## [{new}] — {today}\n\nDaily conformance release.\n\n{log}\n\n"
          old = open("CHANGELOG.md", encoding="utf-8").read()
          # Insert above the first existing release heading.
          i = old.find("\n## ")
          new_txt = old[: i + 1] + entry + old[i + 1:] if i >= 0 else entry + old
          open("CHANGELOG.md", "w", encoding="utf-8").write(new_txt)
          PY
          git add -A VERSION CHANGELOG.md packaging
          git commit -q -m "release(v$NEW): daily conformance fixes (#$PR)"
          git push -q origin HEAD:main

      - name: Release branch + tag (starts release + Docker publish)
        run: |
          NEW="${{ steps.v.outputs.new }}"
          SHA=$(git rev-parse HEAD)
          git push -q origin "$SHA:refs/heads/release/v$NEW"
          git tag -a "v$NEW" "$SHA" -m "v$NEW: daily conformance release"
          git push -q origin "v$NEW"
          echo "Released v$NEW at $SHA"

      - name: Merge the linked portal PR
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          URL=$(printf '%s' "$BODY" | sed -n 's/.*<!-- portal-pr: \(https[^ ]*\) -->.*/\1/p' | head -1)
          if [ -z "$URL" ]; then echo "No linked portal PR."; exit 0; fi
          gh pr merge "$URL" --squash
          echo "Merged $URL (portal deploys from main)."

      - name: Comment on the PR
        if: always()
        run: |
          NEW="${{ steps.v.outputs.new }}"
          if [ "${{ job.status }}" = "success" ]; then
            gh pr comment "$PR" --body "Released **v$NEW**: tag \`v$NEW\`, branch \`release/v$NEW\`. Release + Docker publish are running: https://github.com/${{ github.repository }}/actions"
          else
            gh pr comment "$PR" --body "Release on merge failed. See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
