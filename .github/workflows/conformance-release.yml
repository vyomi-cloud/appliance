name: Release on daily PR merge

# Merging a daily conformance PR (label daily-release, head conformance/daily-*)
# or a new-service PR that passed the service gate (label new-service-release,
# head expansion/*) into main cuts the next PATCH release (3.0.7 → 3.0.8):
#   1. bump VERSION + package manifests + CHANGELOG on main; flip services in
#      services/registry.json from pending-release to released (stamped with the
#      version) — release.yml publishes them as services.json, which the portal
#      reads for its service list and counts
#   2. create release/vX.Y.Z and tag vX.Y.Z — pushed with CONFORMANCE_BOT_TOKEN,
#      so the tag triggers release.yml + docker-publish.yml like a manual release
#   3. sync this release's Nano bundle to the portal (portal-nano-sync.yml,
#      forced): appliance and portal always release together — one portal
#      PR + one paid deploy per release
#
# Merge (not approve) is the trigger: the bot token acts as the repo owner, who
# can't approve a PR they authored.

on:
  pull_request:
    types: [closed]

concurrency:
  group: conformance-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      ((startsWith(github.event.pull_request.head.ref, 'conformance/daily-') &&
        contains(github.event.pull_request.labels.*.name, 'daily-release')) ||
       (startsWith(github.event.pull_request.head.ref, 'expansion/') &&
        contains(github.event.pull_request.labels.*.name, 'new-service-release')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.CONFORMANCE_BOT_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      KIND: ${{ startsWith(github.event.pull_request.head.ref, 'expansion/') && 'New service release' || 'Daily conformance release' }}
    steps:
      - name: Require the bot token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the CONFORMANCE_BOT_TOKEN secret to cut releases."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CONFORMANCE_BOT_TOKEN }}

      # Release notes = every change that ships, not the PR's truncated commit headlines:
      # commits pushed straight to main since the last tag + the PR's commits that weren't
      # already released (scripts/release_notes.py). Claude writes the user-facing
      # highlights from that list; the notes still go out without them if it fails.
      - name: Collect this release's changes
        id: changes
        run: |
          git fetch -q origin "refs/pull/$PR/head:refs/remotes/pr/$PR"
          PREV="v$(tr -d '[:space:]' < VERSION)"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          python3 scripts/release_notes.py --version next --prev "$PREV" --pr-head "refs/remotes/pr/$PR" \
            --kind "$KIND" --commits-out /tmp/release-commits.txt --out /tmp/release-draft.md
          wc -l < /tmp/release-commits.txt

      - name: Write the release highlights (Claude)
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CONFORMANCE_BOT_TOKEN }}
          allowed_bots: 'github-actions,vyomi-conformance-bot'
          prompt: |
            Write the "Highlights" for this Vyomi appliance release, for users (developers who run
            the simulator offline or use Nano in the browser at vyomi.cloud).
            Input: /tmp/release-commits.txt (one change per line: group<TAB>cloud<TAB>text; text is
            tagged [Nano], [offline] or [Nano + offline]) and the draft /tmp/release-draft.md.
            Write ONLY /tmp/release-highlights.md: 3 to 7 markdown bullets, most user-visible first.
            Each bullet starts with a short bold claim, then one plain sentence on what changed for the
            user. Group many small conformance fixes into one bullet with a count and the main services.
            Name new services. No internal jargon (no test ids, finding codes, file paths, commit
            hashes), no pipeline/CI changes unless users notice them, no emoji, nothing not in the input.
          claude_args: >-
            --max-turns 6
            --allowedTools "Read,Write"

      - name: Bump to the next patch version on main
        id: v
        run: |
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"
          OLD=$(tr -d '[:space:]' < VERSION)
          NEW=$(python3 -c "v='$OLD'.split('.');v[-1]=str(int(v[-1])+1);print('.'.join(v))")
          if git ls-remote --exit-code --tags origin "v$NEW" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW already exists"; exit 1
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"; echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "$NEW" > VERSION
          # Only manifests the release still publishes (Scoop, winget and Snap
          # were dropped from the pipeline).
          for f in packaging/rpm/cloud-learn.spec; do
            [ -f "$f" ] && sed -i "s/$(echo "$OLD" | sed 's/\./\\./g')/$NEW/g" "$f"
          done
          python3 - "$NEW" <<'PY'
          import sys, json, os
          new = sys.argv[1]
          # Services that passed the gate go live with this release.
          added = []
          if os.path.exists("services/registry.json"):
              reg = json.load(open("services/registry.json", encoding="utf-8"))
              for s in reg["services"]:
                  if s.get("status") == "pending-release":
                      s["status"], s["released_in"] = "released", new
                      added.append(f"- **{s['cloud'].upper()} {s['name']}**")
              json.dump(reg, open("services/registry.json", "w", encoding="utf-8"), indent=1)
              open("services/registry.json", "a").write("\n")
          open("/tmp/new-services.md", "w").write("\n".join(added) + ("\n" if added else ""))
          PY
          HL=(); [ -s /tmp/release-highlights.md ] && HL=(--highlights /tmp/release-highlights.md)
          python3 scripts/release_notes.py --version "$NEW" --prev "${{ steps.changes.outputs.prev }}" \
            --pr-head "refs/remotes/pr/$PR" --kind "$KIND" "${HL[@]}" --new-services /tmp/new-services.md \
            --write-changelog --write-readme
          git add -A VERSION CHANGELOG.md README.md packaging services
          git commit -q -m "release(v$NEW): ${KIND,,} (#$PR)"
          git push -q origin HEAD:main

      - name: Release branch + tag (starts release + Docker publish)
        run: |
          NEW="${{ steps.v.outputs.new }}"
          SHA=$(git rev-parse HEAD)
          git tag -a "v$NEW" "$SHA" -m "v$NEW: ${KIND,,}"
          git push -q origin "v$NEW"
          # Release branch = the tagged commit + a front page that shows the
          # release checks (placeholder until Release checks report fills it).
          git checkout -q -B "release/v$NEW" "$SHA"
          {
            echo "# Vyomi appliance v$NEW — release checks"; echo
            echo "⏳ **Checks in progress.** This page is replaced with the full results as soon as they finish."; echo
            echo "| Package / check | Platform |"; echo "|---|---|"
            echo "| DEB: cloud-learn + vyomi-docker | Ubuntu |"
            echo "| RPM: cloud-learn + vyomi-docker | Fedora 40 |"
            echo "| Homebrew: vyomi + vyomi-docker | macOS |"
            echo "| MSI: install, upgrade, uninstall (+ signing) | Windows |"
            echo "| Startup: all services + UI status | Linux, release images |"
            echo "| Windows E2E: MSI → vyomi up → services + UI | Windows (self-hosted) |"; echo
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v$NEW"
            echo "- Progress: ${{ github.server_url }}/${{ github.repository }}/actions"
            echo "- Project README: ${{ github.server_url }}/${{ github.repository }}#readme"
          } > README.md
          git add README.md
          git commit -q -m "docs(release): release-checks placeholder for v$NEW"
          git push -q origin "HEAD:refs/heads/release/v$NEW"
          echo "Released v$NEW at $SHA"

      # Appliance and portal release together: the portal's Nano copy gets this
      # release's bundle now, not at some later nightly slot (which silently
      # drifted for weeks). The sync records the released sha in the portal.
      # GITHUB_TOKEN (actions: write above): the bot PAT can push and tag but
      # not dispatch workflows (403), which silently skipped v3.0.10–v3.0.23.
      - name: Sync this release's Nano to the portal
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh workflow run portal-nano-sync.yml -R "${{ github.repository }}" --ref main -f force=true
          echo "Portal Nano sync dispatched for v${{ steps.v.outputs.new }}."

      - name: Comment on the PR
        if: always()
        run: |
          NEW="${{ steps.v.outputs.new }}"
          if [ "${{ job.status }}" = "success" ]; then
            gh pr comment "$PR" --body "Released **v$NEW**: tag \`v$NEW\`, branch \`release/v$NEW\`. Release + Docker publish are running: https://github.com/${{ github.repository }}/actions"
          else
            gh pr comment "$PR" --body "Release on merge failed. See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi

      - name: Refresh the service pipeline page
        if: always()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh workflow run pipeline-status.yml -R "${{ github.repository }}" --ref main || true
