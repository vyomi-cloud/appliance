# vyomi-tunnel through npx, the way agent plugins and MCP configs start it (`npx -y vyomi-tunnel mcp`), on Linux, macOS (arm64 and
# x64) and Windows. One tarball is built like tunnel-release.yml builds it (all five bundled vyomi-mcp binaries), then every OS runs
# tools/npx-smoke/handshake.mjs against it:
#   plain  `npx -y ./vyomi-tunnel-X.tgz mcp` with no tunnel installed: initialize + tools/list, >= 8 tools incl. vyomi_status,
#          under 60 s; the cold-start time goes to the step summary.
#   sync   with an installed vyomi-tunnel, `npx -y --package=./<tgz> vyomi-tunnel mcp` must hand over to it
#          (wasm/relay/mcp-launch.mjs), incl. Windows .cmd shims; nothing but the handover line and the server banner on stderr.
#          (a) installed = the published `installed_version` (default 1.3.3), npx = this build.
#          (b) installed = this build, npx = this build re-versioned one patch up: vyomi_status must return tunnel.installed =
#              this build and tunnel.upgrade. Case (a) asserts those fields only for an installed tunnel >= 1.4.0: earlier
#              releases bundle a vyomi-mcp without the `tunnel` field.
# Locally (no tunnel on PATH): scripts/build_tunnel_mcp.sh && (cd packaging/tunnel && npm pack --pack-destination /tmp/d) &&
#   node tools/npx-smoke/handshake.mjs --tarball '/tmp/d/vyomi-tunnel-*.tgz' --cache /tmp/d/cache
name: Tunnel npx smoke

on:
  push:
    branches: [v4-on-main, 'v4/**']
    paths:
      - packaging/tunnel/**
      - wasm/relay/mcp-launch.mjs
      - scripts/build_tunnel_mcp.sh
      - tools/npx-smoke/**
      - .github/workflows/tunnel-npx-smoke.yml
  pull_request:
    branches: [v4-on-main]
    paths:
      - packaging/tunnel/**
      - wasm/relay/mcp-launch.mjs
      - scripts/build_tunnel_mcp.sh
      - tools/npx-smoke/**
      - .github/workflows/tunnel-npx-smoke.yml
  workflow_dispatch:
    inputs:
      installed_version:
        description: "Published vyomi-tunnel installed globally for sync case (a)"
        type: string
        default: '1.3.3'

permissions:
  contents: read

concurrency:
  group: tunnel-npx-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.pack.outputs.version }}
      next: ${{ steps.pack.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/vyomi/go.mod
          cache-dependency-path: cmd/vyomi/go.mod
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the bundled vyomi-mcp binaries (as tunnel-release.yml)
        run: scripts/build_tunnel_mcp.sh
      - name: npm pack, plus a copy one patch up for sync case (b)
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist next bump
          (cd packaging/tunnel && npm pack --pack-destination ../../dist)
          TGZ=$(ls dist/vyomi-tunnel-*.tgz)
          VER=$(tar xzOf "$TGZ" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          tar xzf "$TGZ" -C bump
          (cd bump/package && npm version patch --no-git-tag-version >/dev/null && npm pack --pack-destination ../../next)
          NEXT=$(tar xzOf next/vyomi-tunnel-*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          echo "version=$VER" >> "$GITHUB_OUTPUT"; echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          ls -l dist next
      - uses: actions/upload-artifact@v4
        with:
          name: npx-smoke-tarballs
          path: |
            dist/vyomi-tunnel-*.tgz
            next/vyomi-tunnel-*.tgz
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64. macos-13 (the last x64 image named in the plan) was retired by GitHub in Dec 2025;
        # macos-15-intel is its x64 replacement.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VER: ${{ needs.build.outputs.version }}
      NEXT: ${{ needs.build.outputs.next }}
      INSTALLED: ${{ inputs.installed_version || '1.3.3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: npx-smoke-tarballs, path: '${{ runner.temp }}/tgz' }

      - name: plain, cold (no vyomi-tunnel installed, fresh npm cache)
        run: |
          set -euo pipefail
          if command -v vyomi-tunnel; then echo "::error::vyomi-tunnel is already on PATH; the plain case needs a clean runner"; exit 1; fi
          node tools/npx-smoke/handshake.mjs --tarball "$RUNNER_TEMP/tgz/dist/vyomi-tunnel-*.tgz" --cache "$RUNNER_TEMP/npx-cold" \
            --min-tools 9 --expect-tool vyomi_status --expect-tool vyomi_agents_md --label "plain, cold (${{ matrix.os }})"
      - name: plain, warm (same npm cache)
        run: |
          node tools/npx-smoke/handshake.mjs --tarball "$RUNNER_TEMP/tgz/dist/vyomi-tunnel-*.tgz" --cache "$RUNNER_TEMP/npx-cold" \
            --min-tools 9 --expect-tool vyomi_status --expect-tool vyomi_agents_md --label "plain, warm (${{ matrix.os }})"

      - name: sync (a) installed vyomi-tunnel@${{ env.INSTALLED }}, npx = this build ${{ env.VER }}
        run: |
          set -euo pipefail
          newer() { node -e 'const p=(s)=>s.split(/[.-]/).slice(0,3).map(Number);const[a,b]=process.argv.slice(1).map(p);for(let i=0;i<3;i++)if(a[i]!==b[i])process.exit(a[i]>b[i]?0:1);process.exit(1)' "$1" "$2"; }
          newer "$VER" "$INSTALLED" || { echo "::error::this build ($VER) is not newer than the installed $INSTALLED, so the npx copy prints no handover line to check"; exit 1; }
          npm i -g "vyomi-tunnel@$INSTALLED"
          echo "installed: $(command -v vyomi-tunnel) -> $(vyomi-tunnel --version)"
          extra=()
          if newer "$INSTALLED" 1.3.999; then extra=(--expect-installed "$INSTALLED" --expect-upgrade); else extra=(--call-status); fi
          node tools/npx-smoke/handshake.mjs --mode sync --tarball "$RUNNER_TEMP/tgz/dist/vyomi-tunnel-*.tgz" --cache "$RUNNER_TEMP/npx-sync-a" \
            --expect-handover "$INSTALLED" "${extra[@]}" --label "sync: installed $INSTALLED, npx $VER (${{ matrix.os }})"

      - name: sync (b) installed = this build ${{ env.VER }}, npx = ${{ env.NEXT }}; vyomi_status tunnel.installed + upgrade
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/tgz/dist" && npm i -g ./vyomi-tunnel-*.tgz)   # ./ : npm reads "dist/x.tgz" as a GitHub user/repo
          REPORTED=$(vyomi-tunnel --version)
          echo "installed: $(command -v vyomi-tunnel) -> $REPORTED"
          # The launcher hands over by `vyomi-tunnel --version`: the stamps in bin/*.mjs must match package.json.
          case "$REPORTED" in *" $VER"|"$VER") ;; *) echo "::error::installed vyomi-tunnel --version says '$REPORTED' but package.json is $VER (version stamps not bumped)"; exit 1 ;; esac
          node tools/npx-smoke/handshake.mjs --mode sync --tarball "$RUNNER_TEMP/tgz/next/vyomi-tunnel-*.tgz" --cache "$RUNNER_TEMP/npx-sync-b" \
            --expect-handover "$VER" --expect-installed "$VER" --expect-upgrade \
            --label "sync: installed $VER, npx $NEXT (${{ matrix.os }})"
