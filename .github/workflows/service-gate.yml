name: Service gate

# The go-live check for a new service. Runs on every expansion/* PR: builds the
# PR's stack fresh, then tests/conformance/expansion/gate.py checks — static
# (engine, byte-identical Nano copy, catalog, registry, test beds, hourly +
# upstream registration, real operation names) and live (offline console
# catalog, every Java/Go/CLI/Playwright suite of the service passes, UI crawl
# clean on offline AND Nano).
#
# Pass → merge the PR with the bot token (conformance-release.yml then cuts the
# patch release, flipping the service to released and publishing services.json
# for the portal). Set repo variable EXPANSION_REQUIRE_APPROVAL=true to merge by
# hand instead. Fail → the report goes on the PR + issue and the issue goes back
# to the expansion agent's queue.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to gate'
        required: true

concurrency:
  group: service-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'expansion/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
    env:
      VYOMI_BASE_URL: http://localhost:9000
      RELAY_HTTP: http://127.0.0.1:8090
      NODE_PATH: ${{ github.workspace }}/.ci-node/node_modules
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Resolve the PR
        id: pr
        run: |
          HEAD=$(gh pr view "$PR" -R "$REPO" --json headRefName -q .headRefName)
          case "$HEAD" in expansion/*) ;; *) echo "::error::$HEAD is not an expansion branch"; exit 1;; esac
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "MANIFEST=services/manifests/${HEAD#expansion/}.json" >> "$GITHUB_ENV"
          ISSUE=$(gh pr view "$PR" -R "$REPO" --json body -q .body | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }

      - name: Install test tooling
        run: |
          pip install --quiet requests pytest boto3 azure-storage-blob
          mkdir -p .ci-node && cd .ci-node
          echo '{"name":"vyomi-ci-node","private":true}' > package.json
          npm install --silent playwright@1.47.2 ws@8.18.0
          npx playwright install --with-deps chromium

      - name: Boot the PR's stack + Nano relay
        run: |
          docker build -t cloudlearn/simulator:ci .
          CLOUDLEARN_SIMULATOR_IMAGE=cloudlearn/simulator:ci \
            docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml up -d \
              $(grep -v '^#' tests/conformance/hourly/ci-services.txt)
          for i in $(seq 1 90); do curl -fs "$VYOMI_BASE_URL/healthz" >/dev/null && break; sleep 2; done
          curl -f "$VYOMI_BASE_URL/healthz"
          nohup node wasm/relay/local-relay.mjs > relay.log 2>&1 &
          for i in $(seq 1 20); do curl -fs "$RELAY_HTTP/health" >/dev/null && break; sleep 1; done

      - name: Apply test license
        env:
          VYOMI_TEST_LICENSE_JWT: ${{ secrets.VYOMI_TEST_LICENSE_JWT }}
        run: |
          [ -z "$VYOMI_TEST_LICENSE_JWT" ] || curl -fs -X POST -H 'Content-Type: application/json' \
            -d "{\"license_key\":\"$VYOMI_TEST_LICENSE_JWT\"}" "$VYOMI_BASE_URL/api/license/activate" >/dev/null

      - name: Service gate (static + live)
        id: gate
        run: |
          if [ ! -f "$MANIFEST" ]; then echo "::error::$MANIFEST missing"; exit 1; fi
          python3 tests/conformance/expansion/gate.py "$MANIFEST"

      - name: Report
        if: always()
        run: |
          f=$(ls tests/conformance/expansion/out/gate-*.md 2>/dev/null | head -1)
          [ -n "$f" ] || { echo "### Service gate — did not run (see ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }})" > /tmp/gate.md; f=/tmp/gate.md; }
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" -R "$REPO" --body-file "$f"
          if [ "${{ steps.gate.outcome }}" != "success" ] && [ -n "$ISSUE" ]; then
            # Back to the expansion agent's queue.
            gh issue comment "$ISSUE" -R "$REPO" --body-file "$f"
            gh issue edit "$ISSUE" -R "$REPO" --remove-label in-review >/dev/null || true
          fi

      # The portal serves its own copy of Nano (portal/app/nano), so the
      # service's Nano changes go there as a patch (portal-only edits preserved,
      # as in the daily PR). conformance-release.yml merges this portal PR with
      # the release, so Nano at vyomi.cloud/nano ships the service at the same
      # time as the offline appliance. If the patch doesn't apply, the service
      # does not go live.
      - name: Portal PR (this service's Nano changes)
        id: portal
        if: success()
        env: { PORTAL_TOKEN: '${{ secrets.CONFORMANCE_BOT_TOKEN }}' }
        run: |
          B="${{ steps.pr.outputs.head }}"
          git fetch -q origin main
          git diff --name-only "origin/main...HEAD" -- wasm/ > /tmp/changed.txt
          python3 - > /tmp/bundle-files.txt <<'PY'
          import sys
          sys.path.insert(0, "wasm")
          from vendor_to_portal import in_bundle
          for line in open("/tmp/changed.txt"):
              rel = line.strip()[len("wasm/"):]
              if rel and in_bundle(rel):
                  print("wasm/" + rel)
          PY
          if [ ! -s /tmp/bundle-files.txt ]; then
            echo "::error::No Nano bundle changes: a new service must ship in Nano too."; exit 1
          fi
          git diff --binary "origin/main...HEAD" -- $(cat /tmp/bundle-files.txt) \
            | sed -e 's#^\(diff --git a/\)wasm/#\1app/nano/#' -e 's# b/wasm/# b/app/nano/#' \
                  -e 's#^--- a/wasm/#--- a/app/nano/#' -e 's#^+++ b/wasm/#+++ b/app/nano/#' \
                  -e 's#^\(rename\|copy\) \(from\|to\) wasm/#\1 \2 app/nano/#' > /tmp/nano.patch
          git clone -q "https://x-access-token:${PORTAL_TOKEN}@github.com/vyomi-cloud/portal.git" /tmp/portal
          cd /tmp/portal
          git config user.name "vyomi-expansion-bot"
          git config user.email "conformance-bot@users.noreply.github.com"
          git checkout -q -B "$B"
          if ! git apply --check /tmp/nano.patch 2>/tmp/apply.err; then
            cat /tmp/apply.err
            echo "### Service gate — ❌ Nano changes don't apply to the portal's copy (portal/app/nano)" > /tmp/conflict.md
            { echo; echo '```'; cat /tmp/apply.err; echo '```'; } >> /tmp/conflict.md
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr comment "$PR" -R "$REPO" --body-file /tmp/conflict.md
            echo "::error::Nano patch doesn't apply to the portal copy; not going live."; exit 1
          fi
          git apply /tmp/nano.patch
          git add -A app/nano
          git commit -q -m "nano: new service from appliance $B" \
            -m "The service's Nano bundle changes, applied as a patch from vyomi-cloud/appliance PR #$PR (portal-only edits preserved)."
          git push -q -f origin "$B"
          URL=$(GH_TOKEN="$PORTAL_TOKEN" gh pr list -R vyomi-cloud/portal --head "$B" --state open --json url -q '.[0].url')
          if [ -z "$URL" ]; then
            URL=$(GH_TOKEN="$PORTAL_TOKEN" gh pr create -R vyomi-cloud/portal --base main --head "$B" \
              --title "Nano: new service from appliance $B" \
              --body "Nano bundle changes for the new service in vyomi-cloud/appliance#$PR, applied as a patch. Merged automatically with the appliance release, so Nano and the offline simulator ship the service together. Merging deploys the portal.")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Link it so conformance-release.yml merges it with the release.
          cd "$GITHUB_WORKSPACE"
          BODY=$(GH_TOKEN="$PORTAL_TOKEN" gh pr view "$PR" -R "$REPO" --json body -q .body | sed '/<!-- portal-pr: /d')
          printf '%s\n\n<!-- portal-pr: %s -->\n' "$BODY" "$URL" > /tmp/body.md
          GH_TOKEN="$PORTAL_TOKEN" gh pr edit "$PR" -R "$REPO" --body-file /tmp/body.md >/dev/null
          echo "Portal PR: $URL"

      - name: Back to the agent if the Nano sync failed
        if: failure() && steps.gate.outcome == 'success' && env.ISSUE != ''
        run: |
          gh issue comment "$ISSUE" -R "$REPO" --body "The gate passed but the Nano changes couldn't be synced to the portal (no Nano bundle changes, or the patch doesn't apply to portal/app/nano). Nano and offline must ship together, so this service is not live yet. ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" -R "$REPO" --remove-label in-review >/dev/null || true

      - name: Go live (merge → patch release)
        if: success() && vars.EXPANSION_REQUIRE_APPROVAL != 'true'
        env: { GH_TOKEN: '${{ secrets.CONFORMANCE_BOT_TOKEN }}' }
        run: |
          gh pr merge "$PR" -R "$REPO" --squash
          echo "Merged #$PR; conformance-release.yml cuts the release."

      - name: Refresh the service pipeline page
        if: always()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh workflow run pipeline-status.yml -R "${{ github.repository }}" --ref main || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml down -v
