name: Release

# On every STABLE v*.*.* tag (no -rc/-beta/-alpha suffix) or manual dispatch:
#   1. Build the source tarball + .deb + .rpm
#   2. Publish a GitHub Release with all artifacts attached
#   3. Fan out to the Homebrew tap (OPT-IN via its secret). Windows ships as the
#      MSI on the GitHub Release. winget (2026-10-06), Snap (2026-10-23) and
#      Scoop (2026-10-26) were dropped — see the "REMOVED" notes.
#
# Release Candidate tags (v*-rc*, v*-beta*, v*-alpha*) are handled by
# the separate release-candidate.yml workflow, which builds the SAME
# artifacts but publishes them as a GitHub Pre-release and skips all
# downstream channel promotion. The promotion path from RC → final is
# manual: `vyomi promote-rc v2.0.4-rc1` re-tags the same commit as
# v2.0.4 (no -rc suffix), which fires THIS workflow.
#
# Required secrets — none for a default release (just builds the tarball
# + .deb + .rpm + GitHub Release). Each downstream PM is gated on its
# own secret being present. Adding a secret turns that PM's job on:
#
#   HOMEBREW_TAP_TOKEN        — PAT (contents:write) on the homebrew-tap repo
#
# Note: Chocolatey was dropped 2026-06-11, Scoop 2026-10-26. Windows users
# install the MSI from the GitHub Release.
#
# The Docker Hub publish lives in a separate workflow (docker-publish.yml).

on:
  push:
    tags:
      - 'v*.*.*'       # 3-segment: v2.0.4
      - 'v*.*.*.*'     # 4-segment patch hotfix: v2.0.4.1
      # Exclude pre-release suffixes — those route through
      # release-candidate.yml. GitHub Actions tag filters support
      # negation via `!` (the positive pattern above keeps this list
      # syntactically valid — negation alone wouldn't fire anything).
      - '!v*-rc*'
      - '!v*-beta*'
      - '!v*-alpha*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true

permissions:
  contents: write     # github-release needs to write the Release page
  issues: write       # close the issues this release fixed, with a 'Shipped in' note
  packages: write     # if any job ever needs to push to GHCR

env:
  GH_OWNER: vyomi-cloud
  GH_REPO:  appliance

jobs:
  # ── Preflight: which downstream PMs have credentials? ───────────────────
  # Secrets CANNOT be referenced from job-level `if:` expressions in GitHub
  # Actions. The clean workaround is to evaluate them inside a step and
  # surface the result via job outputs that downstream `if:` can consume.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_brew:   ${{ steps.check.outputs.has_brew }}
    steps:
      - id: check
        env:
          BREW:   ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          mask() { [ -n "$1" ] && echo true || echo false; }
          {
            echo "has_brew=$(mask "$BREW")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Downstream targets"
            echo "- Homebrew tap : $(mask "$BREW")"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── source tarball + deb + rpm ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tarball_sha256: ${{ steps.shas.outputs.tarball_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3'}

      - name: Install fpm (for .deb + .rpm)
        run: gem install --no-document fpm

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "$VER" > VERSION
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # Every package starts the appliance from the bundled compose files;
      # pin them to THIS release's images so an installed version never drifts
      # onto whatever `latest` is later (the Windows E2E caught a 3.0.7 MSI
      # running :latest). Main keeps :latest for development.
      - name: Pin bundled compose files to this release's images
        run: |
          VER="${{ steps.ver.outputs.version }}"
          for f in docker-compose.cloudlite.yml docker-compose.appliance.yml; do
            [ -f "$f" ] || continue
            sed -i -E "s#vyomi/(appliance|cloudsim):latest#vyomi/\1:${VER}#g" "$f"
            grep -nE "vyomi/(appliance|cloudsim):" "$f"
          done
          ! grep -qE "vyomi/(appliance|cloudsim):latest" docker-compose.cloudlite.yml

      # services.json — the released-service registry with counts, attached to
      # the GitHub Release (dist/*). The portal reads the latest release's copy,
      # so every service count on the site follows releases automatically.
      - name: Publish the service registry (services.json)
        run: |
          mkdir -p dist
          python3 - "${{ steps.ver.outputs.version }}" <<'PY'
          import json, sys
          reg = json.load(open("services/registry.json"))
          svcs = [s for s in reg["services"] if s.get("status") == "released"]
          counts = {c: sum(1 for s in svcs if s["cloud"] == c) for c in ("aws", "gcp", "azure")}
          out = {"version": sys.argv[1], "total": sum(counts.values()), "counts": counts,
                 "services": [{k: s[k] for k in ("cloud", "key", "name", "upstream", "released_in")} for s in svcs]}
          json.dump(out, open("dist/services.json", "w"), indent=1)
          print(f"services.json: {out['total']} services {counts}")
          PY

      - name: Build source tarball
        run: |
          mkdir -p dist
          # IMPORTANT: cloudsim-backbone is the Java-based simulator
          # backbone that docker-compose.appliance.yml builds at startup.
          # Missing from v1.0.0 - v1.1.8 tarballs (regression). The
          # appliance launcher's tar+transfer step would silently fail
          # when this dir was absent. Always include it going forward.
          # The allowlist below MUST include every path the appliance
          # Dockerfile + cloudsim Dockerfile COPY from build context.
          # Verified by scripts/verify-bundle.sh — please re-run it after
          # editing this list (or adding a new COPY directive).
          # Past regressions: cloudsim-backbone was missing v1.0.0-v1.1.8;
          # routes + setup_cython.py were missing v1.0.0-v1.1.9.
          # vyomi-X.tar.gz is the release tarball. cloud-learn-X.tar.gz is the same
          # bundle under the retired name, for ONE transition release (v3.0.33): the
          # `vyomi update` of launchers <= 3.0.32 downloads cloud-learn-<latest>.tar.gz
          # and reads cloud-learn-<latest>/docker-compose.cloudlite.yml from it.
          for NAME in vyomi cloud-learn; do
          tar czf "dist/$NAME-${{ steps.ver.outputs.version }}.tar.gz" \
            --exclude='.git' --exclude='__pycache__' --exclude='node_modules' \
            --exclude='dist' --exclude='**/target' --exclude='**/playwright-report' \
            --transform "s,^,$NAME-${{ steps.ver.outputs.version }}/," \
            core providers packs routes static \
            server.py setup_cython.py requirements.txt VERSION \
            Dockerfile docker-compose.yml docker-compose.appliance.yml \
            docker-compose.cloudlite.yml \
            cloudsim-backbone \
            .env.example packaging scripts docs install.sh \
            README.md CHANGELOG.md LICENSE
          done

      - name: Build .deb
        run: bash packaging/debian/build-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Build .rpm via fpm
        run: |
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/usr/lib/cloud-learn" "$STAGE/usr/bin" "$STAGE/usr/share/doc/vyomi"
          # Same bundle as the .deb (packaging/debian/build-deb.sh): routes,
          # setup_cython.py, packaging (bind-mounted backend configs + the shared
          # packaging/docker/vyomi launcher) and cloudsim-backbone were missing, so
          # the RPM's backends crash-looped and vyomi --version/update fell back.
          cp -r core providers packs routes static scripts packaging cloudsim-backbone \
                server.py setup_cython.py requirements.txt VERSION Dockerfile \
                docker-compose.yml docker-compose.appliance.yml docker-compose.cloudlite.yml \
                .env.example install.sh \
                "$STAGE/usr/lib/cloud-learn/"
          # Primary launcher: /usr/bin/vyomi
          cat > "$STAGE/usr/bin/vyomi" <<'EOF'
          #!/usr/bin/env bash
          export CLOUD_LEARN_HOME="${CLOUD_LEARN_HOME:-/usr/lib/cloud-learn}"
          export CLOUDLEARN_DISTRIBUTION_MODE="${CLOUDLEARN_DISTRIBUTION_MODE:-appliance}"
          exec bash "$CLOUD_LEARN_HOME/scripts/cloud-learn" "$@"
          EOF
          chmod 0755 "$STAGE/usr/bin/vyomi"
          # Legacy shim: /usr/bin/cloud-learn → /usr/bin/vyomi (deprecation warning)
          cat > "$STAGE/usr/bin/cloud-learn" <<'EOF'
          #!/usr/bin/env bash
          if [ -z "$VYOMI_NO_DEPRECATION_WARN" ] && [ -t 2 ]; then
            printf '\033[33mNote:\033[0m \033[2m`cloud-learn` is deprecated. Use `vyomi` instead. Suppress: VYOMI_NO_DEPRECATION_WARN=1\033[0m\n' >&2
          fi
          exec /usr/bin/vyomi "$@"
          EOF
          chmod 0755 "$STAGE/usr/bin/cloud-learn"
          cp README.md LICENSE CHANGELOG.md "$STAGE/usr/share/doc/vyomi/"
          # Package `vyomi` (was `cloud-learn`): Obsoletes/Provides the old name, so
          # `dnf upgrade` moves existing installs over.
          fpm -s dir -t rpm \
            -n vyomi -v "${{ steps.ver.outputs.version }}" \
            --replaces "cloud-learn < ${{ steps.ver.outputs.version }}" --provides "cloud-learn = ${{ steps.ver.outputs.version }}" \
            --license BUSL-1.1 --architecture noarch \
            --maintainer "Vyomi <support@vyomi.cloud>" \
            --url "https://github.com/${{ env.GH_OWNER }}/${{ env.GH_REPO }}" \
            --description "Local multi-cloud simulator (AWS/GCP/Azure) with real backends" \
            --depends bash --depends curl \
            --chdir "$STAGE" \
            --package "dist/vyomi-${{ steps.ver.outputs.version }}-1.noarch.rpm" \
            .

      - name: Build vyomi-docker (.deb + .rpm — Docker substrate, Free/Lite/Pro)
        # Thin Docker-substrate launcher: the `vyomi` wrapper + the pull-only
        # docker-compose.cloudlite.yml, no Multipass/LXD. Conflicts with the
        # Max package `vyomi` (both own /usr/bin/vyomi) — a host installs one.
        run: bash packaging/docker/build-docker-packages.sh "${{ steps.ver.outputs.version }}"

      - name: Compute SHA256 of tarball (Homebrew formula bump needs it)
        id: shas
        run: |
          TARBALL_SHA="$(sha256sum dist/vyomi-${{ steps.ver.outputs.version }}.tar.gz | awk '{print $1}')"
          echo "tarball_sha256=$TARBALL_SHA" >> "$GITHUB_OUTPUT"
          {
            for f in dist/*; do sha256sum "$f"; done
          } > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

  # ── Windows MSI (WiX) ───────────────────────────────────────────────────
  # Builds packaging/windows/cloudlearn.wxs into a per-machine MSI that
  # bundles the launcher and puts `vyomi` on PATH. Uploaded as the `msi`
  # artifact, which github-release attaches to the Release (so winget-releaser
  # can consume it). Signing is OPT-IN: set repo variable
  # ENABLE_MSI_SIGNING=true + the Azure Trusted Signing secrets/vars below.
  windows-msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: release-artifacts, path: dist}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26'}

      - name: Stage the bundle + compiled vyomi.exe launcher
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          New-Item -ItemType Directory -Force -Path stage, stage/bin | Out-Null
          # Extract the exact same bundle the .tar.gz / .deb / .rpm ship.
          tar -xzf "dist/vyomi-$ver.tar.gz" -C stage --strip-components=1
          # Compile the native launcher (replaces the PowerShell script). winget
          # rejects scripted/wrapper apps, so the program a user runs must be a
          # compiled binary — see PR microsoft/winget-pkgs#392224.
          $env:GOOS = "windows"; $env:GOARCH = "amd64"; $env:CGO_ENABLED = "0"
          $exe = Join-Path (Resolve-Path stage/bin).Path "vyomi.exe"
          # cmd/vyomi is its own Go module → build from inside it (go -C).
          go -C cmd/vyomi build -trimpath -ldflags "-s -w" -o "$exe" .
          if (-not (Test-Path $exe)) { throw "vyomi.exe was not built" }
          # Do NOT ship the host PowerShell launcher — the native binary replaces
          # it. (The bash launcher stays: it runs INSIDE the Linux appliance VM.)
          Remove-Item -Force -ErrorAction SilentlyContinue stage/scripts/cloud-learn.ps1

      - name: Install WiX toolset
        # Pin to v5: WiX v7 requires accepting the Open Source Maintenance Fee
        # (OSMF) EULA at runtime (error WIX7015) and fails in non-interactive CI.
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wix build packaging/windows/cloudlearn.wxs -arch x64 `
            -d Version=$ver -d "StageDir=$((Resolve-Path stage).Path)" `
            -o "dist/vyomi-$ver-x64.msi"

      - name: Sign MSI (opt-in — Azure Trusted Signing)
        if: ${{ vars.ENABLE_MSI_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi

      - name: Compute MSI SHA256
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $msi = "dist/vyomi-$ver-x64.msi"
          (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$msi.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/vyomi-*-x64.msi*
          retention-days: 30

  # ── GitHub Release page ─────────────────────────────────────────────────
  github-release:
    needs: [build, windows-msi]
    # Ship the release as long as the core build succeeded — never let a
    # Windows MSI hiccup skip the whole release. The MSI attaches if it built.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tags + history: the issues this release fixed
      - uses: actions/download-artifact@v4
        with: {name: release-artifacts, path: dist}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: msi, path: dist}

      - name: Extract changelog for this version
        id: changelog
        run: |
          VER="${{ needs.build.outputs.version }}"
          # Extract section between ## [<version>] and the next ## header
          awk -v v="$VER" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" v "\\]") { in_section=1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog-section.md || true
          [ -s /tmp/changelog-section.md ] || echo "See CHANGELOG.md" > /tmp/changelog-section.md
          {
            echo 'body<<EOF'
            cat /tmp/changelog-section.md
            echo
            echo "---"
            echo "## Artifacts"
            echo
            ls dist | sed 's/^/- /'
            echo
            echo "**Docker image:** \`docker pull vyomi/appliance:${VER}\`"
            echo "**Install:** \`curl -fsSL https://raw.githubusercontent.com/${{ env.GH_OWNER }}/${{ env.GH_REPO }}/main/install.sh | bash\`"
            echo "**SHA256 checksums:** see \`SHA256SUMS\` in attached artifacts."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Vyomi v${{ needs.build.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          # Mark *-rc*, *-beta*, *-alpha* tags as prereleases so they
          # don't update :latest or appear as the "Latest" release on
          # the GitHub repo home page.
          prerelease: ${{ contains(needs.build.outputs.version, '-rc') || contains(needs.build.outputs.version, '-beta') || contains(needs.build.outputs.version, '-alpha') }}

      # Shipped: every issue this release fixed ("Fixes #N" in its commits) gets a
      # "Shipped in vX.Y.Z" comment (reporter thanked by name when it was filed under a
      # person's account) and is closed. Skipped for pre-releases.
      - name: Close the issues this release shipped
        if: ${{ !contains(needs.build.outputs.version, '-') }}
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          VER="${{ needs.build.outputs.version }}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VER" | head -1)
          [ -n "$PREV" ] || { echo "No previous release tag."; exit 0; }
          python3 scripts/close_shipped_issues.py --version "$VER" --prev "$PREV" --repo "${{ github.repository }}"

  # ── Brew tap auto-bump ──────────────────────────────────────────────────
  # Bumps vyomi.rb + vyomi-docker.rb in the vyomi-cloud/homebrew-tap repo with the
  # new url + sha256. Requires HOMEBREW_TAP_TOKEN secret (PAT with `contents:write`
  # on vyomi-cloud/homebrew-tap). Falls back to a no-op if missing.
  brew-bump:
    needs: [preflight, build]
    if: needs.preflight.outputs.has_brew == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GH_OWNER }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Checkout main repo (vyomi-docker formula template)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Bump formulae (vyomi / Max + vyomi-docker / Free·Lite·Pro)
        run: |
          VER="${{ needs.build.outputs.version }}"
          SHA="${{ needs.build.outputs.tarball_sha256 }}"
          URL="https://github.com/${{ env.GH_OWNER }}/${{ env.GH_REPO }}/releases/download/v${VER}/vyomi-${VER}.tar.gz"
          bump() {  # $1 = formula path — both ship from the SAME release tarball
            sed -i.bak \
              -e "s|url \".*\"|url \"${URL}\"|" \
              -e "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
              -e "s|version \".*\"|version \"${VER}\"|" \
              "$1"
            rm -f "$1.bak"
          }
          # Max (Multipass) formula — copy the template too, so its text tracks the repo.
          cp src/packaging/homebrew/Formula/vyomi.rb tap/Formula/vyomi.rb
          bump tap/Formula/vyomi.rb
          # Docker (Free/Lite/Pro) formula — copy the template from the main repo.
          cp src/packaging/homebrew/Formula/vyomi-docker.rb tap/Formula/vyomi-docker.rb
          bump tap/Formula/vyomi-docker.rb
          cd tap
          git config user.email "bot@vyomi.cloud"
          git config user.name  "Vyomi Release Bot"
          git add Formula/vyomi.rb Formula/vyomi-docker.rb
          git commit -m "vyomi ${VER} (vyomi + vyomi-docker)"
          git push

  # ── Snap Store publish — REMOVED ────────────────────────────────────────
  # Dropped 2026-10-23: the snap-publish job failed on every release (v3.0.x),
  # turning each otherwise-green release red for a channel nobody installs from.
  # Linux is served by the .deb/.rpm on the GitHub Release + Homebrew. Snap
  # releases are dropped for good: packaging/snap/ was deleted 2026-10-29.

  # ── Winget PR submission — REMOVED (2026-10-06) ─────────────────────────
  # Official winget-pkgs submissions need manual moderator review and the
  # headless CLI MSI trips its automated validation. Windows ships as the MSI on
  # the GitHub Release.

  # ── Scoop bucket auto-bump — REMOVED (2026-10-26) ───────────────────────
  # Dropped with winget: Windows ships as the MSI on the GitHub Release. The
  # vyomi-cloud/scoop-bucket repo is no longer updated.
