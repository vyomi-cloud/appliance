name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Static checks (fast, no docker) ─────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Syntax check all .py
        run: |
          python -m compileall -q core providers server.py
          echo "✓ all .py files compile cleanly"
      - name: tier_policy module load
        run: python -c "from core import tier_policy as tp; print('tiers:', list(tp._TIER_POLICY.keys()))"
      - name: Nano relay loaders import every core they need
        run: python wasm/build_cores.py --check
      - name: All three launchers show the same launch view
        run: python tests/launcher/test_launch_view_consistency.py

  # ── Backend stack + conformance (the gate) ──────────────────────────────
  conformance:
    runs-on: ubuntu-latest
    needs: lint
    services: {}  # we use docker-compose directly below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install client libs
        run: pip install boto3 google-cloud-storage google-cloud-pubsub requests
      - name: Start Vyomi stack
        env:
          CLOUDLEARN_DEV_MODE: "1"
        run: |
          # DEV_MODE=1 keeps /api/license/signup available in CI (production
          # mode disables that endpoint by design — see core/license_remote).
          # --profile full starts every real backend (Vault, NATS, MinIO,
          # DynamoDB, ElasticMQ, MySQL, Azurite, Pub/Sub, Firestore); without
          # it they never start here and every KMS/secrets/eventing/IAM/MinIO
          # check fails with status=0.
          # The CI override sets CLOUDLEARN_TIER_ENFORCE=0 (no Free-tier locks,
          # quotas or rate limit) and VYOMI_NO_TELEMETRY=1 inside the simulator.
          docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml \
            --profile full up -d --build
          # Wait for /healthz
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/healthz > /dev/null; then
              echo "✓ simulator up after ${i}s"
              break
            fi
            sleep 2
          done
      - name: Wait for every backend to be ready
        run: |
          for i in $(seq 1 60); do
            r=$(curl -sf http://127.0.0.1:9000/api/runtime/readiness || true)
            echo "$r" | python3 -c "import sys,json;d=json.load(sys.stdin);print(f\"{d.get('ready_count')}/{d.get('total_count')} ready\");sys.exit(0 if d.get('ready') else 1)" 2>/dev/null && break
            sleep 5
          done
          curl -sf http://127.0.0.1:9000/api/runtime/readiness | python3 -c "import sys,json;d=json.load(sys.stdin);[print(s['name'],s['status']) for s in d.get('services',[])]" || true
      - name: Sign up Enterprise (so eventing/nosql aren't tier-locked)
        run: |
          # If signup endpoint is disabled (prod mode reached us anyway), fall
          # back to a no-op so the conformance step still runs; the threshold
          # is what gates the build.
          curl -sf -X POST http://127.0.0.1:9000/api/license/signup \
            -H "Content-Type: application/json" \
            -d '{"user":"ci","email":"ci@cl.io","tier":"enterprise","seats":10,"period":"annual"}' \
            || echo "::warning::signup unavailable — continuing on default tier"
      - name: Conformance — per-service (isolated, threshold 85%)
        run: |
          # 2026-10-26: back to 85% — with every backend started (--profile full)
          # the suite scores 90.1%; the remaining 4 failures are GCP data-path
          # bugs (storage insert 502, pubsub pull 500, firestore 500).
          # 2026-06-14: dropped threshold 85 → 45 to reflect actual baseline.
          # The 85% number assumed the older suite hit 88% in-house. After the
          # MVP launch the run_conformance.py harness drifted (more services
          # marked as `warn(deviation)` than `pass`) and main has been
          # silently sitting at ~49% — but the failing "Sign up Enterprise"
          # step ahead of this one was masking it. Now that signup works
          # again (CLOUDLEARN_DEV_MODE=1) the real number is visible.
          #
          # Tracking issue: climb run_conformance.py back to 85%. The newer
          # tests/conformance/console_actions/ harness (96%+) is the parity
          # gate we actually use; this older suite is kept around as a
          # SDK-level smoke test.
          # MinIO is published on the runner at :9100 (the default points at an
          # old Multipass VM IP).
          CLOUDLEARN_MINIO_URL_HOST=http://127.0.0.1:9100 \
          python tests/conformance/run_conformance.py \
            --endpoint http://127.0.0.1:9000 \
            --isolate-spaces \
            --fail-under 85.0
      - name: Simulator errors (tracebacks) from this run
        if: always()
        run: |
          docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml logs --no-color simulator 2>&1 \
            | grep -B3 -A40 "Traceback" | grep -vE "^\s*\^+\s*$" | tail -400 || echo "no tracebacks"
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml --profile full down -v

  # ── Tier middleware smoke (no docker, uses uvicorn) ─────────────────────
  tier-middleware:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install minimal deps
        run: pip install -r requirements.txt
      - name: Boot uvicorn in background
        env:
          CLOUDLEARN_DEV_MODE: "1"
        run: |
          # DEV_MODE keeps /api/license/signup callable for the tier round-trip.
          CLOUDLEARN_DEV_MODE=1 uvicorn server:app --host 127.0.0.1 --port 9001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9001/healthz > /dev/null && break
            sleep 1
          done
      - name: Tier policy + /api/runtime/tier round-trip
        run: |
          set -e
          # Default Free → cloud_shell denied
          sc=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9001/api/runtime/cloud-shell)
          [ "$sc" = "403" ] || { echo "Free cloud_shell should be 403; got $sc"; exit 1; }
          # Sign up Enterprise → all 7 enterprise endpoints flip 200
          curl -s -X POST http://127.0.0.1:9001/api/license/signup \
            -H "Content-Type: application/json" \
            -d '{"user":"ci","email":"ci@cl.io","tier":"enterprise","seats":10,"period":"annual"}'
          for ep in cloud-shell ci-integration terraform-deploy-targets audit-sinks notification-channels custom-domain branding; do
            sc=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9001/api/runtime/$ep 2>/dev/null || true)
            # 200 OK or 405 (POST-only) both prove the gate passed; 403 would fail
            if [ "$sc" = "403" ]; then
              echo "Enterprise $ep should not be 403; got $sc"
              exit 1
            fi
            echo "  ✓ $ep → HTTP $sc (gate passed)"
          done
          # Helm chart real
          sc=$(curl -s -o /tmp/c -w "%{http_code}" http://127.0.0.1:9001/api/runtime/helm/chart.tar.gz)
          [ "$sc" = "200" ] || { echo "helm chart 200 expected; got $sc"; exit 1; }
          file /tmp/c | grep -q "gzip compressed" || { echo "helm tarball not gzip"; exit 1; }
          echo "✓ tier middleware smoke passed"

  # ── Reference apps build (compile-only smoke) ───────────────────────────
  refapps-build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        app: [java-orders, go-inventory, azure-tickets]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        if: matrix.app == 'java-orders'
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Set up Go
        if: matrix.app != 'java-orders'
        uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - name: Build ${{ matrix.app }}
        run: |
          cd tests/e2e/${{ matrix.app }}
          if [ -f pom.xml ]; then
            mvn -q -DskipTests compile
          elif [ -f go.mod ]; then
            go build ./...
          else
            echo "no build file — skipping"
          fi
