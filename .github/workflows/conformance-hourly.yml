name: Hourly conformance agent

# Every hour: boot the offline appliance + serve Nano, crawl every console for
# broken/unimplemented UI (incl. blank grid cells, default-create gaps and
# cost-savings updates), run the Java/Go/Python SDK, CLI and API test beds and
# detect features without coverage (detect job); triage the findings into one
# slice per cloud and let three conformance agents fix them IN PARALLEL, each on
# its own cloud, pushing to today's conformance/daily-* branch (fix jobs); then
# publish the coverage page to GitHub Pages (publish job).
# Agent instructions: tests/conformance/hourly/AGENT.md

on:
  schedule:
    # Hourly, non-negotiable. Also triggered by the always-on laptop's
    # heartbeat (vyomi-cloud/release-e2e) if GitHub's scheduler misses a slot.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      skip_agent:
        description: 'Run tests and publish only (no agent)'
        type: boolean
        default: false

# One run at a time; a run that overlaps the next hour queues instead of racing
# the agents' pushes.
concurrency:
  group: conformance-hourly
  cancel-in-progress: false

env:
  VYOMI_BASE_URL: http://localhost:9000
  RELAY_HTTP: http://127.0.0.1:8090
  NODE_PATH: ${{ github.workspace }}/.ci-node/node_modules
  PAGE_URL: https://vyomi-cloud.github.io/appliance
  TAB_SHARDS: '3'   # each run walks the detail tabs of 1/3 of the services

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write     # pushes today's daily branch (merged with main) for the fixers
      issues: read        # the upstream-drift backlog
    outputs:
      daily_branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The agents work on one branch per day (India time); the daily PR workflow
      # opens it as a PR into main at 23:45 IST. Tests run on that branch so the
      # day's fixes build on each other.
      - name: Use today's daily branch
        id: branch
        run: |
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"
          B="conformance/daily-$(TZ=Asia/Kolkata date +%F)"
          if git ls-remote --exit-code origin "$B" >/dev/null 2>&1; then
            git fetch -q origin "$B"
            git checkout -q -B "$B" FETCH_HEAD
            # Pick up anything merged to main since the branch was cut.
            git merge -q --no-edit origin/main || git merge --abort
          else
            git checkout -q -B "$B"
          fi
          # Publish it so all three fixers start from the same commit.
          git push -q origin "HEAD:refs/heads/$B"
          echo "name=$B" >> "$GITHUB_OUTPUT"
          echo "Working on $B"

      # Tooling comes from THIS workflow's commit, not the daily branch (which
      # may predate it); kept out of git so agents never commit it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: |
            .github/actions
            tests/conformance/hourly/triage.py
            tests/conformance/hourly/AGENT.md
      - run: echo ".ci-tools/" >> .git/info/exclude

      - uses: ./.ci-tools/.github/actions/conformance-stack
        with:
          test-license-jwt: ${{ secrets.VYOMI_TEST_LICENSE_JWT }}

      - name: Fetch previous history + feature inventory
        run: |
          mkdir -p prev
          curl -fsL "https://raw.githubusercontent.com/${{ github.repository }}/conformance-report/history.json" -o prev/history.json \
            || curl -fsL "$PAGE_URL/history.json" -o prev/history.json || echo '[]' > prev/history.json
          # Last run's feature inventory: the baseline new features are diffed against.
          curl -fsL "https://raw.githubusercontent.com/${{ github.repository }}/conformance-report/inventory.json" \
            -o prev/inventory.json || rm -f prev/inventory.json
          echo "PREV_INVENTORY=$PWD/prev/inventory.json" >> "$GITHUB_ENV"
          # Last run's console surfaces: tab results carried forward for the
          # services whose tabs aren't walked this hour (TAB_SHARDS).
          curl -fsL "https://raw.githubusercontent.com/${{ github.repository }}/conformance-report/ui-findings.json" \
            -o prev/ui-findings.json || rm -f prev/ui-findings.json
          echo "PREV_UI=$PWD/prev/ui-findings.json" >> "$GITHUB_ENV"

      - name: Detect new features, parity gaps and untested operations
        run: python3 tests/conformance/hourly/detect_new_features.py

      - name: Upstream backlog (open upstream-drift issues)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          mkdir -p tests/conformance/hourly/out
          gh issue list -R "${{ github.repository }}" --label upstream-drift --state open --limit 200 \
            --json number,title,labels,createdAt,body > tests/conformance/hourly/out/upstream_issues.json || echo '[]' > tests/conformance/hourly/out/upstream_issues.json
          echo "open upstream-drift issues: $(python3 -c "import json;print(len(json.load(open('tests/conformance/hourly/out/upstream_issues.json'))))")"

      - name: Run conformance test beds
        run: python3 tests/conformance/hourly/run_suites.py

      - name: Triage findings into one slice per cloud
        if: always()
        run: |
          python3 .ci-tools/tests/conformance/hourly/triage.py --out tests/conformance/hourly/out
          cat tests/conformance/hourly/out/slices/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Hand findings to the fixers and the publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-findings-${{ github.run_id }}
          path: |
            tests/conformance/hourly/out/
            prev/
            relay.log
          include-hidden-files: true
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml down -v

  # Three agents fix in parallel, one cloud each, on their own stack. Clouds map
  # to mostly separate files (static|wasm/<cloud>-console.html, providers/<cloud>_*),
  # so pushes rarely collide; each rebases before pushing and leaves a conflicting
  # fix for the next run.
  fix:
    needs: detect
    if: ${{ !inputs.skip_agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    permissions:
      contents: write     # agent pushes fixes to the daily branch
      issues: read
      id-token: write
    env:
      DAILY_BRANCH: ${{ needs.detect.outputs.daily_branch }}
      SLICE: ${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.daily_branch }}
          fetch-depth: 0

      - name: Bot identity
        run: |
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"

      # Tooling comes from THIS workflow's commit, not the daily branch (which
      # may predate it); kept out of git so agents never commit it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: |
            .github/actions
            tests/conformance/hourly/triage.py
            tests/conformance/hourly/AGENT.md
      - run: echo ".ci-tools/" >> .git/info/exclude

      - uses: ./.ci-tools/.github/actions/conformance-stack
        with:
          test-license-jwt: ${{ secrets.VYOMI_TEST_LICENSE_JWT }}

      - name: This hour's findings
        uses: actions/download-artifact@v4
        with:
          name: hourly-findings-${{ github.run_id }}

      - name: Conformance agent — ${{ matrix.cloud }} slice
        continue-on-error: true
        timeout-minutes: 85
        uses: anthropics/claude-code-action@v1
        with:
          # Either auth works: a Claude Max/Pro OAuth token (claude setup-token)
          # or an Anthropic API key. Whichever secret is set is used.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Chained runs are dispatched by the workflow token, so the actor is
          # github-actions[bot]; the action refuses bot actors unless allowed.
          allowed_bots: 'github-actions'
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow .ci-tools/tests/conformance/hourly/AGENT.md exactly (this run's copy of the
            instructions — not the daily branch's), including "Parallel fixers".
            You are the ${{ matrix.cloud }} fixer: your work list is
            tests/conformance/hourly/out/slices/${{ matrix.cloud }}.json (summary in
            slices/${{ matrix.cloud }}.md); other inputs are in tests/conformance/hourly/out/.
            Two other agents are fixing the other clouds at the same time.
            Push only to the daily branch ${{ env.DAILY_BRANCH }} (never to main).
          claude_args: >-
            --max-turns 200
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Keep the agent's summary
        if: always()
        run: |
          mkdir -p summary
          cp tests/conformance/hourly/out/agent_summary.md "summary/${{ matrix.cloud }}.md" 2>/dev/null \
            || echo "No summary written." > "summary/${{ matrix.cloud }}.md"
          { echo "## ${{ matrix.cloud }} fixer"; cat "summary/${{ matrix.cloud }}.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-summary-${{ matrix.cloud }}-${{ github.run_id }}
          path: summary/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml down -v

  publish:
    needs: [detect, fix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write     # conformance-report branch
      actions: write      # chain the next hourly run
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: This hour's findings
        uses: actions/download-artifact@v4
        with:
          name: hourly-findings-${{ github.run_id }}

      - name: Build coverage page
        if: always()
        run: python3 tests/conformance/hourly/build_site.py --history prev/history.json

      # The report lives in the repo itself: README.md (+ raw JSON + the
      # interactive index.html) on the dedicated conformance-report branch,
      # rendered at github.com/<repo>/tree/conformance-report. A separate branch
      # keeps 24 report commits a day off main.
      - name: Publish report to the conformance-report branch
        if: always()
        run: |
          set -e
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"
          rm -rf /tmp/report && mkdir /tmp/report && cp -r tests/conformance/hourly/site/. /tmp/report/
          if git ls-remote --exit-code origin conformance-report >/dev/null 2>&1; then
            git fetch -q origin conformance-report
            git worktree add -q /tmp/report-wt FETCH_HEAD
            git -C /tmp/report-wt checkout -q -B conformance-report
          else
            git worktree add -q --detach /tmp/report-wt
            git -C /tmp/report-wt checkout -q --orphan conformance-report
            git -C /tmp/report-wt rm -rfq . || true
          fi
          find /tmp/report-wt -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/report/. /tmp/report-wt/
          cd /tmp/report-wt
          git add -A
          git commit -q -m "conformance report $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no report changes"
          git push -q origin conformance-report
          echo "Report: https://github.com/${{ github.repository }}/tree/conformance-report"

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: tests/conformance/hourly/site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4

      - name: Refresh the service pipeline page
        if: always()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh workflow run pipeline-status.yml -R "${{ github.repository }}" --ref main || true

      # GitHub's cron scheduler doesn't reliably fire for this repo, and hourly
      # runs are non-negotiable: each run starts the next one, waiting out the
      # rest of the hour first. Skipped if a run is already queued (e.g. a
      # manual one or a late cron), so there is only ever one chain.
      - name: Chain the next hourly run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # End of day (IST): open/refresh the daily PR — GitHub's cron for
          # conformance-daily-pr.yml doesn't fire either. From 23:00 IST each
          # run refreshes today's PR (idempotent); after midnight, the first run
          # makes sure yesterday's branch got its PR.
          ist_hour=$(TZ=Asia/Kolkata date +%H)
          if [ "$ist_hour" -ge 23 ]; then
            gh workflow run conformance-daily-pr.yml -R "${{ github.repository }}" --ref main && echo "Daily PR dispatched for $(TZ=Asia/Kolkata date +%F)."
          fi
          yday=$(TZ=Asia/Kolkata date -d yesterday +%F)
          if git ls-remote --exit-code origin "refs/heads/conformance/daily-$yday" >/dev/null 2>&1 \
             && [ -z "$(gh pr list -R "${{ github.repository }}" --head "conformance/daily-$yday" --state all --json number -q '.[0].number')" ]; then
            gh workflow run conformance-daily-pr.yml -R "${{ github.repository }}" --ref main -f date="$yday" && echo "Daily PR dispatched for $yday (missed)."
          fi
          # Nano → portal now ships with each release (conformance-release.yml),
          # so appliance and portal always release together.
          # Expansion agent: daily cadence = one run per 24h started from here;
          # continuous = revive its chain if nothing is running or queued.
          if gh workflow view expansion-agent.yml -R "${{ github.repository }}" >/dev/null 2>&1; then
            live=$(gh run list -R "${{ github.repository }}" --workflow expansion-agent.yml -L 20 \
              --json status -q '[.[] | select(.status!="completed")] | length')
            last=$(gh run list -R "${{ github.repository }}" --workflow expansion-agent.yml -L 1 --json createdAt -q '.[0].createdAt // empty')
            age=999999; [ -n "$last" ] && age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "${live:-0}" -eq 0 ] && { [ "${{ vars.EXPANSION_CADENCE || 'continuous' }}" = "continuous" ] || [ "$age" -ge 86400 ]; }; then
              gh workflow run expansion-agent.yml -R "${{ github.repository }}" --ref main && echo "Expansion agent started."
            fi
          fi
          queued=$(gh run list -R "${{ github.repository }}" --workflow conformance-hourly.yml \
            --json status -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ "${queued:-0}" -gt 0 ]; then echo "A run is already queued; not chaining."; exit 0; fi
          start=$(gh run view "${{ github.run_id }}" -R "${{ github.repository }}" --json startedAt -q .startedAt)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$start" +%s) ))
          wait=$(( 3600 - elapsed ))
          if [ "$wait" -gt 0 ]; then echo "Waiting ${wait}s to keep an hourly cadence"; sleep "$wait"; fi
          gh workflow run conformance-hourly.yml -R "${{ github.repository }}" --ref main
          echo "Next hourly run dispatched."

