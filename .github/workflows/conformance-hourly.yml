name: Hourly conformance agent

# One conformance cycle (the name is historical: cycles are no longer hourly).
# prepare (daily branch, last run's baselines, upstream backlog) -> detect, sharded
# into six parallel jobs (offline|nano x aws|gcp|azure), each on its own stack
# running its suites and its slice of the console crawl -> collect (merge the
# shards, triage into one slice per cloud) -> fix (three conformance agents in
# parallel, one cloud each, pushing to today's conformance/daily-* branch) ->
# publish (coverage page, report branch, hand over to the watchdog).
# A cycle takes as long as it needs; conformance-watchdog.yml starts the next one
# CONFORMANCE_COOLDOWN_MIN (default 60) minutes after this one finishes.
# Agent instructions: tests/conformance/hourly/AGENT.md

on:
  # No schedule: conformance-watchdog.yml starts each cycle.
  workflow_dispatch:
    inputs:
      skip_agent:
        description: 'Run tests and publish only (no agent)'
        type: boolean
        default: false

# One cycle at a time; a second one queues instead of racing the agents' pushes.
concurrency:
  group: conformance-hourly
  cancel-in-progress: false

env:
  VYOMI_BASE_URL: http://localhost:9000
  RELAY_HTTP: http://127.0.0.1:8090
  NODE_PATH: ${{ github.workspace }}/.ci-node/node_modules
  PAGE_URL: https://vyomi-cloud.github.io/appliance
  TAB_SHARDS: '3'   # each run walks the detail tabs of 1/3 of the services

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # pushes today's daily branch (merged with main) for the shards and fixers
      issues: read        # the upstream-drift backlog
    outputs:
      daily_branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The agents work on one branch per day (India time); the daily PR workflow
      # opens it as a PR into main at 23:45 IST. Tests run on that branch so the
      # day's fixes build on each other.
      - name: Use today's daily branch
        id: branch
        run: |
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"
          B="conformance/daily-$(TZ=Asia/Kolkata date +%F)"
          if git ls-remote --exit-code origin "$B" >/dev/null 2>&1; then
            git fetch -q origin "$B"
            git checkout -q -B "$B" FETCH_HEAD
            # Pick up anything merged to main since the branch was cut.
            git merge -q --no-edit origin/main || git merge --abort
          else
            git checkout -q -B "$B"
          fi
          # Publish it so every shard and fixer starts from the same commit.
          git push -q origin "HEAD:refs/heads/$B"
          echo "name=$B" >> "$GITHUB_OUTPUT"
          echo "Working on $B"

      - name: Fetch previous history + feature inventory
        run: |
          mkdir -p prev
          curl -fsL "https://raw.githubusercontent.com/${{ github.repository }}/conformance-report/history.json" -o prev/history.json \
            || curl -fsL "$PAGE_URL/history.json" -o prev/history.json || echo '[]' > prev/history.json
          # Last run's feature inventory: the baseline new features are diffed against.
          curl -fsL "https://raw.githubusercontent.com/${{ github.repository }}/conformance-report/inventory.json" \
            -o prev/inventory.json || rm -f prev/inventory.json
          # Last run's console surfaces: tab results carried forward for the
          # services whose tabs aren't walked this run (TAB_SHARDS).
          curl -fsL "https://raw.githubusercontent.com/${{ github.repository }}/conformance-report/ui-findings.json" \
            -o prev/ui-findings.json || rm -f prev/ui-findings.json

      - name: Upstream backlog (open upstream-drift issues)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          mkdir -p tests/conformance/hourly/out
          gh issue list -R "${{ github.repository }}" --label upstream-drift --state open --limit 200 \
            --json number,title,labels,createdAt,body > tests/conformance/hourly/out/upstream_issues.json || echo '[]' > tests/conformance/hourly/out/upstream_issues.json
          echo "open upstream-drift issues: $(python3 -c "import json;print(len(json.load(open('tests/conformance/hourly/out/upstream_issues.json'))))")"
          # Issues filed automatically from users' simulators: the fixers take these first.
          gh issue list -R "${{ github.repository }}" --label user-reported --state open --limit 200 \
            --json number,title,labels,createdAt,body,author > tests/conformance/hourly/out/user_reported.json || echo '[]' > tests/conformance/hourly/out/user_reported.json
          echo "open user-reported issues: $(python3 -c "import json;print(len(json.load(open('tests/conformance/hourly/out/user_reported.json'))))")"

      - uses: actions/upload-artifact@v4
        with:
          name: prepare-${{ github.run_id }}
          path: |
            prev/
            tests/conformance/hourly/out/upstream_issues.json
            tests/conformance/hourly/out/user_reported.json
          retention-days: 7

  # Six shards in parallel, each on its own stack: wall time stays flat as
  # services are added (add shards, not minutes). Within a shard suites still run
  # one at a time: offline suites share the appliance's active space (622398c).
  # Cloud-less suites run in the aws shard of their target; the crawls are split
  # per cloud (run_suites.py --cloud). Feature detection needs a live appliance,
  # so it runs once, in the offline/aws shard.
  detect:
    needs: prepare
    runs-on: ubuntu-latest
    # A hang guard, not a deadline: a shard takes as long as its suites need
    # (each suite has its own timeout in suites.json).
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [offline, nano]
        cloud: [aws, gcp, azure]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.daily_branch }}

      # Tooling comes from THIS workflow's commit, not the daily branch (which
      # may predate it); kept out of git so agents never commit it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: |
            .github/actions
            tests/conformance/hourly/run_suites.py
            tests/conformance/hourly/ui_crawler.mjs
      - run: echo ".ci-tools/" >> .git/info/exclude
      # The daily branch normally has main's runner (prepare merges main in); if
      # that merge was aborted, use this commit's sharding-aware copies.
      - name: Sharding-aware runner
        run: |
          grep -q -- '--cloud' tests/conformance/hourly/run_suites.py \
            || cp .ci-tools/tests/conformance/hourly/run_suites.py tests/conformance/hourly/run_suites.py
          grep -q 'ONLY_CLOUDS' tests/conformance/hourly/ui_crawler.mjs \
            || cp .ci-tools/tests/conformance/hourly/ui_crawler.mjs tests/conformance/hourly/ui_crawler.mjs

      - uses: ./.ci-tools/.github/actions/conformance-stack
        with:
          test-license-jwt: ${{ secrets.VYOMI_TEST_LICENSE_JWT }}

      - uses: actions/download-artifact@v4
        with:
          name: prepare-${{ github.run_id }}
      - name: Last run's baselines
        run: |
          if [ -f prev/inventory.json ]; then echo "PREV_INVENTORY=$PWD/prev/inventory.json" >> "$GITHUB_ENV"; fi
          if [ -f prev/ui-findings.json ]; then echo "PREV_UI=$PWD/prev/ui-findings.json" >> "$GITHUB_ENV"; fi

      - name: Detect new features, parity gaps and untested operations
        if: matrix.target == 'offline' && matrix.cloud == 'aws'
        run: python3 tests/conformance/hourly/detect_new_features.py

      - name: Run conformance test beds (${{ matrix.target }} / ${{ matrix.cloud }})
        run: python3 tests/conformance/hourly/run_suites.py --target ${{ matrix.target }} --cloud ${{ matrix.cloud }}

      # Always present, so the artifact keeps the repo-root layout (upload-artifact
      # roots it at the common parent of the matched files) and merges cleanly.
      - name: Keep the relay log
        if: always()
        run: |
          log="relay-${{ matrix.target }}-${{ matrix.cloud }}.log"
          if [ -f relay.log ]; then mv relay.log "$log"; else : > "$log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.target }}-${{ matrix.cloud }}-${{ github.run_id }}
          path: |
            tests/conformance/hourly/out/
            relay-*.log
          include-hidden-files: true
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml down -v

  collect:
    needs: [prepare, detect]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tests/conformance/hourly
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: prepare-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*-${{ github.run_id }}
          merge-multiple: true
      - name: Merge the shards
        run: python3 tests/conformance/hourly/merge_shards.py

      - name: Triage findings into one slice per cloud
        run: |
          python3 tests/conformance/hourly/triage.py --out tests/conformance/hourly/out
          cat tests/conformance/hourly/out/slices/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Hand findings to the fixers and the publisher
        uses: actions/upload-artifact@v4
        with:
          name: hourly-findings-${{ github.run_id }}
          path: |
            tests/conformance/hourly/out/
            prev/
            relay-*.log
          include-hidden-files: true
          retention-days: 7

  # Three agents fix in parallel, one cloud each, on their own stack. Clouds map
  # to mostly separate files (static|wasm/<cloud>-console.html, providers/<cloud>_*),
  # so pushes rarely collide; each rebases before pushing and leaves a conflicting
  # fix for the next run.
  fix:
    needs: [prepare, collect]
    if: ${{ !inputs.skip_agent && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    permissions:
      contents: write     # agent pushes fixes to the daily branch
      issues: read
      id-token: write
    env:
      DAILY_BRANCH: ${{ needs.prepare.outputs.daily_branch }}
      SLICE: ${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.daily_branch }}
          fetch-depth: 0

      - name: Bot identity
        run: |
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"

      # Tooling comes from THIS workflow's commit, not the daily branch (which
      # may predate it); kept out of git so agents never commit it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: |
            .github/actions
            tests/conformance/hourly/triage.py
            tests/conformance/hourly/AGENT.md
      - run: echo ".ci-tools/" >> .git/info/exclude

      - uses: ./.ci-tools/.github/actions/conformance-stack
        with:
          test-license-jwt: ${{ secrets.VYOMI_TEST_LICENSE_JWT }}

      - name: This cycle's findings
        uses: actions/download-artifact@v4
        with:
          name: hourly-findings-${{ github.run_id }}

      - name: Conformance agent — ${{ matrix.cloud }} slice
        continue-on-error: true
        timeout-minutes: 85
        uses: anthropics/claude-code-action@v1
        with:
          # Either auth works: a Claude Max/Pro OAuth token (claude setup-token)
          # or an Anthropic API key. Whichever secret is set is used.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cycles are dispatched by the watchdog with the workflow token, so the
          # actor is github-actions[bot]; the action refuses bot actors unless allowed.
          allowed_bots: 'github-actions'
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow .ci-tools/tests/conformance/hourly/AGENT.md exactly (this run's copy of the
            instructions — not the daily branch's), including "Parallel fixers".
            You are the ${{ matrix.cloud }} fixer: your work list is
            tests/conformance/hourly/out/slices/${{ matrix.cloud }}.json (summary in
            slices/${{ matrix.cloud }}.md); other inputs are in tests/conformance/hourly/out/.
            Two other agents are fixing the other clouds at the same time.
            Push only to the daily branch ${{ env.DAILY_BRANCH }} (never to main).
          claude_args: >-
            --max-turns 200
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Keep the agent's summary
        if: always()
        run: |
          mkdir -p summary
          cp tests/conformance/hourly/out/agent_summary.md "summary/${{ matrix.cloud }}.md" 2>/dev/null \
            || echo "No summary written." > "summary/${{ matrix.cloud }}.md"
          { echo "## ${{ matrix.cloud }} fixer"; cat "summary/${{ matrix.cloud }}.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-summary-${{ matrix.cloud }}-${{ github.run_id }}
          path: summary/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f tests/conformance/hourly/docker-compose.ci.yml down -v

  publish:
    needs: [collect, fix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write     # conformance-report branch
      actions: write      # hand over to the watchdog; refresh the pipeline page
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: This cycle's findings
        uses: actions/download-artifact@v4
        with:
          name: hourly-findings-${{ github.run_id }}

      - name: Build coverage page
        if: always()
        run: python3 tests/conformance/hourly/build_site.py --history prev/history.json

      # The report lives in the repo itself: README.md (+ raw JSON + the
      # interactive index.html) on the dedicated conformance-report branch,
      # rendered at github.com/<repo>/tree/conformance-report. A separate branch
      # keeps 24 report commits a day off main.
      - name: Publish report to the conformance-report branch
        if: always()
        run: |
          set -e
          git config user.name "vyomi-conformance-bot"
          git config user.email "conformance-bot@users.noreply.github.com"
          rm -rf /tmp/report && mkdir /tmp/report && cp -r tests/conformance/hourly/site/. /tmp/report/
          if git ls-remote --exit-code origin conformance-report >/dev/null 2>&1; then
            git fetch -q origin conformance-report
            git worktree add -q /tmp/report-wt FETCH_HEAD
            git -C /tmp/report-wt checkout -q -B conformance-report
          else
            git worktree add -q --detach /tmp/report-wt
            git -C /tmp/report-wt checkout -q --orphan conformance-report
            git -C /tmp/report-wt rm -rfq . || true
          fi
          find /tmp/report-wt -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/report/. /tmp/report-wt/
          cd /tmp/report-wt
          git add -A
          git commit -q -m "conformance report $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no report changes"
          git push -q origin conformance-report
          echo "Report: https://github.com/${{ github.repository }}/tree/conformance-report"

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: tests/conformance/hourly/site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4

      - name: Refresh the service pipeline page
        if: always()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh workflow run pipeline-status.yml -R "${{ github.repository }}" --ref main || true

      # Hand over: the watchdog waits out the cooldown, then starts the next
      # cycle (and does the end-of-day daily PR and expansion-agent duties this
      # step used to). Its 15-minute cron is the backup if this never runs.
      - name: Hand over to the watchdog
        if: always()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh workflow run conformance-watchdog.yml -R "${{ github.repository }}" --ref main \
            -f wait_min="${{ vars.CONFORMANCE_COOLDOWN_MIN || '60' }}"
          echo "Next cycle in ~${{ vars.CONFORMANCE_COOLDOWN_MIN || '60' }} min (conformance-watchdog.yml)."
