# CI override for the hourly conformance run: lift tier limits (service locks,
# quantity caps, rate limit) so suites measure behaviour, not the Free tier,
# and keep CI boots out of the install/traction numbers.
services:
  simulator:
    # The workflow boots without VYOMI_DOCKER_GID, so the non-root `cloudlearn`
    # user cannot open /var/run/docker.sock (group differs per runner image) and
    # every EC2/VM launch failed with "permission denied" -> state=stopped.
    # CI boots are ephemeral, so run as root to reach the socket on any runner.
    user: "0:0"
    environment:
      CLOUDLEARN_TIER_ENFORCE: "0"
      # Test boots must not count as installs in the traction numbers.
      VYOMI_NO_TELEMETRY: "1"
    # The runner's docker.sock is root:docker (gid varies per image) and the
    # workflows don't export VYOMI_DOCKER_GID, so the non-root app user got
    # "permission denied" -> EC2/GCE/VM launches failed with DockerUnavailable.
    # CI-only: run as root so the bind-mounted socket is usable.
    user: "0:0"
