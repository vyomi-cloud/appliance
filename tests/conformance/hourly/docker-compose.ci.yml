# CI override for the hourly conformance run: lift tier limits (service locks,
# quantity caps, rate limit) so suites measure behaviour, not the Free tier,
# and keep CI boots out of the install/traction numbers.
services:
  simulator:
    # docker-compose.yml's own group_add (VYOMI_DOCKER_GID) already covers
    # /var/run/docker.sock access for the simulator's non-root `cloudlearn`
    # user; don't repeat it here — merging two compose files with the same
    # literal group_add entry fails ("items at 0 and 1 are equal"). A prior
    # fix ran the container as root (user: "0:0") instead, which also gave
    # docker.sock access but ran the EC2 LXD backend as root too, breaking
    # its unprivileged-container launch and leaving every instance in
    # state=stopped right after create (aws.ec2.reboot -> 409, console-
    # actions pinned at 172/173 since v3.0.40's #498). The booting workflow
    # just needs to export VYOMI_DOCKER_GID before `docker compose up`.
    environment:
      CLOUDLEARN_TIER_ENFORCE: "0"
      # Test boots must not count as installs in the traction numbers.
      VYOMI_NO_TELEMETRY: "1"
