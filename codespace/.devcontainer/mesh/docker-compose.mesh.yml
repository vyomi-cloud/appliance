# Vyomi Mesh — headless. Simulator only (compute + AI); no host ports are published.
# Access is exclusively over the user's ssh session (sshd devcontainer feature): the laptop's vyomi-tunnel connects IN. The Codespace dials nothing.
name: vyomi-mesh
networks:
  vyomi-net:
    name: vyomi-net
# The Mesh role (core/mesh_session.py, mesh_ai.py) exists only in v4 images. NEVER default to :latest: on 2026-11-10 it was a v3 build (3.0.46)
# with no Mesh code, and every Mesh Codespace booted it. Pin the exact release tag at GA; override with VYOMI_SIMULATOR_IMAGE.
services:
  simulator:
    image: ${VYOMI_SIMULATOR_IMAGE:-vyomi/appliance:v4-preview}
    pull_policy: always
    user: "0:0"
    networks: [vyomi-net]
    expose: ["9000", "50051"]
    environment:
      CLOUDLEARN_STATE_FILE: /data/cloudlearn_state.sqlite3
      CLOUDLEARN_DISTRIBUTION_MODE: developer
      VYOMI_ROLE: mesh
      # requests arrive through the user's ssh forward with Host: simulator:9000 or the forwarded address; the mesh's DNS-rebinding guard must allow them
      VYOMI_MESH_HOSTS: simulator
      VYOMI_COMPUTE_BACKEND: docker
      VYOMI_INSTANCE_NETWORK: vyomi-net
      VYOMI_LICENSE_JWT: ${VYOMI_LICENSE_JWT:-}
      VYOMI_INSTALL_ID: ${CODESPACE_NAME:-vyomi-mesh}
      # Signed session token from the portal + the shared verification key: the simulator refuses everything without
      # them, serves one cloud on Pro, and refuses all after session_end (core/mesh_session.py).
      VYOMI_MESH_SESSION_TOKEN: ${VYOMI_MESH_SESSION_TOKEN:-}
      VYOMI_MESH_SESSION_KEY: ${VYOMI_MESH_SESSION_KEY:-}
      # AI pack: the model ids to ADMIT against the AI RAM bucket (core/mesh_ai.py). The mesh appliance then points
      # VYOMI_LLM_ENDPOINT at the `llm` gateway below; WebLLM stays the Nano-only fallback.
      VYOMI_MESH_AI_MODEL: ${VYOMI_MESH_AI_MODEL:-qwen3-4b}
      # Lambda functions run inside the simulator and call back into it with boto3: they need ambient (dummy) credentials like real Lambda's role env.
      # Found by running the reference app (examples/enterprise-facilities-agent) against a bare simulator: NoCredentialsError without these.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      VYOMI_MESH_AI_EMBED: ${VYOMI_MESH_AI_EMBED:-bge-small}
      # GCP real backends (profile "gcp-real", off by default; mesh-up.sh/boot-mesh.sh do not start it): when VYOMI_GCP_REAL_BACKENDS=1 the
      # simulator uses the two emulators below as its Pub/Sub + Firestore data plane (core/gcp_real_backends.py).
      VYOMI_GCP_REAL_BACKENDS: ${VYOMI_GCP_REAL_BACKENDS:-}
      PUBSUB_EMULATOR_HOST: ${VYOMI_GCP_PUBSUB_EMULATOR_HOST:-}
      FIRESTORE_EMULATOR_HOST: ${VYOMI_GCP_FIRESTORE_EMULATOR_HOST:-}
      VYOMI_GCP_GRPC_PORT: ${VYOMI_GCP_GRPC_PORT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mesh-data:/data
  # ---- GCP real backends (profile "gcp-real") ---------------------------------------------------------------------------
  # The official Google emulators, same image the offline appliance uses. Bound to the Codespace's loopback only, so the user's ssh
  # forward (-L 8085/8080/50051) reaches them and nothing else does. Start with:
  #   VYOMI_GCP_REAL_BACKENDS=1 VYOMI_GCP_PUBSUB_EMULATOR_HOST=gcp-pubsub:8085 VYOMI_GCP_FIRESTORE_EMULATOR_HOST=gcp-firestore:8080 \
  #     docker compose -f docker-compose.mesh.yml --profile gcp-real up -d gcp-pubsub gcp-firestore simulator
  gcp-pubsub:
    image: ${VYOMI_GCP_EMULATOR_IMAGE:-gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators}
    profiles: ["gcp-real"]
    networks: [vyomi-net]
    restart: unless-stopped
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085"]
    ports: ["127.0.0.1:8085:8085"]
  gcp-firestore:
    image: ${VYOMI_GCP_EMULATOR_IMAGE:-gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators}
    profiles: ["gcp-real"]
    networks: [vyomi-net]
    restart: unless-stopped
    command: ["gcloud", "beta", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080"]
    ports: ["127.0.0.1:8080:8080"]
  # ---- AI pack (profile "ai"; boot-mesh.sh starts it only after the simulator ADMITS the models) -------------------------
  # Two llama.cpp servers (one model per process) behind a tiny OpenAI-compatible gateway. Models are pulled on first start
  # by llama-server's -hf into the ai-models volume (cached across stop/resume of the same Codespace). No published ports.
  llm-chat:
    image: ${VYOMI_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["ai"]
    networks: [vyomi-net]
    restart: unless-stopped
    # llm-chat-entry.sh: restarts llama-server when a trained chat adapter lands in mesh-data/llm-adapters (read-only mount; no docker socket needed)
    entrypoint: ["/bin/sh", "/entry.sh"]
    environment: { VYOMI_LLM_ADAPTER_DIR: /mesh-data/llm-adapters }
    volumes: [ai-models:/root/.cache, mesh-data:/mesh-data:ro, ./llm-chat-entry.sh:/entry.sh:ro]
    # --jinja: native tool-call templates; -np 1: one slot on 2 cores (queue upstream); --cache-reuse: keep the shared prompt prefix
    command: ["-hf", "${VYOMI_AI_CHAT_HF:-unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}", "--host", "0.0.0.0", "--port", "8080",
              "-c", "${VYOMI_AI_CHAT_CTX:-4096}", "--jinja", "-np", "1", "--cache-reuse", "256", "-t", "2", "--alias", "${VYOMI_MESH_AI_MODEL:-qwen3-4b}"]
  llm-embed:
    image: ${VYOMI_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["ai"]
    networks: [vyomi-net]
    restart: unless-stopped
    volumes: [ai-models:/root/.cache]
    command: ["-hf", "${VYOMI_AI_EMBED_HF:-CompendiumLabs/bge-small-en-v1.5-gguf:Q8_0}", "--host", "0.0.0.0", "--port", "8080",
              "--embeddings", "-c", "${VYOMI_AI_EMBED_CTX:-512}", "-np", "1", "-t", "1"]
  llm:
    image: ${VYOMI_SIMULATOR_IMAGE:-vyomi/appliance:v4-preview}
    profiles: ["ai"]
    networks: [vyomi-net]
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["python", "-m", "core.mesh_llm_gateway"]
    environment: { CHAT_URL: "http://llm-chat:8080", EMBED_URL: "http://llm-embed:8080", PORT: "8080" }
    # The image's baked healthcheck curls :9000 (the simulator); this gateway listens on :8080, so it always showed "unhealthy".
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  mesh-data:
  ai-models:
